<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nganjuk Group Effluxion - Temporary Email Generator</title>
    <!-- Menggunakan font Poppins dari Google Fonts untuk tampilan modern -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Reset margin & padding */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        /* Background gradien gelap yang keren */
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Styling Bagian Header */
        header {
            text-align: center;
            padding: 40px 20px 20px 20px;
            width: 100%;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(to right, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 4px 15px rgba(79, 172, 254, 0.3);
            margin-bottom: 5px;
        }

        header p {
            font-size: 1.1rem;
            font-weight: 300;
            color: #d1d5db;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Container utama untuk iFrame */
        main {
            width: 100%;
            max-width: 1200px;
            flex: 1;
            padding: 0 20px 40px 20px;
            display: flex;
            justify-content: center;
        }

        /* Efek Glassmorphism untuk bingkai iFrame */
        .iframe-container {
            width: 100%;
            height: 75vh;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            overflow: hidden;
            position: relative;
            transition: transform 0.3s ease;
        }

        .iframe-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);
        }

        /* iFrame Styling */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #ffffff; /* Mengantisipasi jika Tmailor membutuhkan background putih */
        }

        /* Footer */
        footer {
            width: 100%;
            text-align: center;
            padding: 20px;
            font-size: 0.9rem;
            color: #9ca3af;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        footer span {
            color: #4facfe;
            font-weight: 600;
        }

        /* Responsif untuk layar HP */
        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8rem;
            }
            header p {
                font-size: 0.9rem;
            }
            .iframe-container {
                height: 70vh;
                border-radius: 15px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Nganjuk Group Effluxion</h1>
        <p>Temporary Email Generator</p>
    </header>

    <main>
        <div class="iframe-container">
            <!-- iFrame Tmailor -->
            <iframe src="https://mailporary.com/id" title="Nganjuk Group Effluxion Temp Mail" allow="clipboard-read; clipboard-write"></iframe>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 <span>Nganjuk Group Effluxion</span>. All rights reserved.</p>
    </footer>

</body>
</html>
